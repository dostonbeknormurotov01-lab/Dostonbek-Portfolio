<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doston Normurodov — SMM & Mobilograf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1226;--bg2:#101a33;--card:#16244a;--or:#f4a261;--tx:#eef1f8;--mut:#9aa6c0;--vi:#a78bfa;--cy:#67e8f9;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Manrope,system-ui,sans-serif;padding:0 34px;overflow-x:hidden}
/* film strip edges */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:22px;background:linear-gradient(#0000 0 12px,#ffffff30 12px 24px) 50% 0/8px 24px repeat-y,#0a1020;z-index:5;animation:fs 3s linear infinite}
body::after{animation-direction:reverse}@keyframes fs{to{background-position:50% 24px,0 0}}
body::before{left:0}body::after{right:0}
a{color:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.wrap{max-width:1080px;margin:0 auto}
header{position:sticky;top:0;z-index:4;background:#0b1226e6;backdrop-filter:blur(8px);border-bottom:1px solid #ffffff14}
header .wrap{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:10px 0;flex-wrap:wrap}
nav{display:flex;gap:16px;flex-wrap:wrap;font-weight:600;font-size:14px}
nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--or)}
.lang button{background:none;border:1px solid #ffffff2a;color:var(--mut);padding:3px 10px;border-radius:99px;font:600 12px Manrope;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--or);border-color:var(--or);color:#101a33}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
h1,h2,h3{font-family:Unbounded,sans-serif;line-height:1.15}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:64px 0 48px}
h1{font-size:clamp(34px,6vw,64px);font-weight:700}
.role{color:var(--or);font-weight:800;font-size:18px;margin:14px 0 18px}
.about{max-width:52ch;color:#cdd5e6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chips a{display:inline-flex;gap:6px;align-items:center;border:1px solid #ffffff2a;border-radius:99px;padding:5px 13px;text-decoration:none;font-size:14px;font-weight:600}
.chips a:hover{border-color:var(--or);color:var(--or)}
/* phone */
.phone{width:min(260px,70vw);aspect-ratio:9/17;margin:auto;border:3px solid #ffffff30;border-radius:34px;padding:10px;background:linear-gradient(160deg,#1b2d5c,#0d162e);position:relative;box-shadow:0 0 0 8px #ffffff08}
.screen{height:100%;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 38%,#f4a26130,#0000 60%),#0a1020;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.av{width:150px;height:150px;border-radius:50%;border:3px solid var(--or);overflow:hidden;margin:auto;position:relative;z-index:2;box-shadow:0 0 36px #f4a26155}.av img{width:100%;height:100%;object-fit:cover;display:block}
.rec{position:absolute;top:14px;left:16px;font:700 12px Manrope;display:flex;gap:6px;align-items:center;z-index:2}
.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:b 1.2s steps(2) infinite}
@keyframes b{50%{opacity:.15}}
.big{font:700 44px Unbounded;color:var(--or);position:relative;z-index:2;text-shadow:0 2px 12px #000}
.bl{font-size:13px;color:#fff;position:relative;z-index:2;text-shadow:0 1px 6px #000}
.bar{height:4px;background:#ffffff30;border-radius:9px;margin-top:12px;position:relative;z-index:2}.bar i{display:block;height:100%;width:0;background:var(--or);border-radius:9px;transition:width 2s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px}
.stat{background:var(--bg2);border-left:3px solid var(--or);padding:14px 16px;border-radius:0 10px 10px 0}
.stat b{font:700 28px Unbounded;display:block}.stat span{color:var(--mut);font-size:13px}
section{padding:44px 0}
h2{font-size:clamp(24px,4vw,36px);margin-bottom:6px;display:flex;gap:12px;align-items:center}
.sub{color:var(--mut);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.v{position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px;text-decoration:none;color:#fff;background:linear-gradient(170deg,#1d3068,#0d162e);border:1px solid #ffffff22;transition:transform .25s,border-color .25s}
.v:hover{transform:translateY(-4px);border-color:var(--or)}
.v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#0000 55%,#000c)}
.v>*:not(img){position:relative;z-index:1}
.ac{align-self:flex-start;background:#0b1226cc;padding:3px 10px;border-radius:99px;font:700 13px Manrope}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--or);display:grid;place-items:center;transition:transform .25s}.pbtn svg{width:26px;height:26px;fill:#101a33}
.v:hover .pbtn{transform:scale(1.12)}
.go{font:600 13px Manrope;background:#0b1226cc;padding:6px 12px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.v.empty{opacity:.5;pointer-events:none}
/* AI lab */
.ai{margin:0 -34px;padding:56px 34px;background:radial-gradient(circle at 80% 0,#a78bfa33,#0000 50%),linear-gradient(#67e8f90f 1px,#0000 1px) 0 0/100% 32px,linear-gradient(90deg,#67e8f90f 1px,#0000 1px) 0 0/32px 100%,#080d1dd0}
.ai h2 svg{color:var(--cy)}.ai .v{border-color:#a78bfa66;box-shadow:0 0 22px #a78bfa22}
.ai .v .pbtn{background:var(--cy)}
.proj{display:grid;gap:14px}
details{background:var(--bg2);border:1px solid #ffffff18;border-radius:14px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary h3{font-size:20px}.per{color:var(--or);font-weight:700;font-size:14px}
details[open] summary{border-bottom:1px solid #ffffff18}
.pb{padding:16px 20px 20px;display:grid;gap:10px}
.pb li{margin-left:20px}.pb li::marker{color:var(--or)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.res h3{font-size:18px;margin-bottom:12px;color:var(--or)}
.sk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.sk span{background:var(--card);padding:5px 13px;border-radius:99px;font-size:14px}
.ct a{display:flex;gap:10px;align-items:center;margin-bottom:8px;text-decoration:none}.ct a:hover{color:var(--or)}
#edu a{color:var(--or)}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(80px);opacity:.26;animation:orb 26s ease-in-out infinite alternate}
.o1{background:#f4a261;top:-140px;left:-120px}.o2{background:#5b6cff;bottom:-180px;right:-140px;animation-delay:-12s}
@keyframes orb{to{transform:translate(120px,80px) scale(1.15)}}
.ic{position:absolute;color:var(--or);opacity:.15;animation:fl var(--d) ease-in-out var(--dl) infinite alternate}.ic.b{color:#8fa6ff;opacity:.13}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes fl{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
main,.ai,footer{position:relative;z-index:1}
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#16244a,#070c1a 70%);display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .9s}
#gate.out{opacity:0;pointer-events:none}
.gn{font:700 clamp(28px,7vw,56px)/1.1 Unbounded,sans-serif}
.gl{width:0;height:2px;background:var(--or);margin:20px auto;animation:gl 1.6s .3s forwards}@keyframes gl{to{width:120px}}
.gs{color:var(--mut);margin-bottom:26px}
.gb{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
#gon,#goff{padding:12px 26px;border-radius:99px;font:700 15px Manrope,sans-serif;cursor:pointer}
#gon{background:var(--or);color:#101a33;border:0}#goff{background:none;border:1px solid #ffffff44;color:var(--tx)}
#snd{position:fixed;right:40px;bottom:20px;z-index:6;display:flex;gap:8px;align-items:center;background:#0b1226e6;border:1px solid #ffffff2a;color:var(--tx);padding:10px 14px;border-radius:99px;cursor:pointer;backdrop-filter:blur(6px)}
#snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}#snd:not(.on) svg{opacity:.55}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:4px;background:var(--or);border-radius:2px}
#snd.on .eq i{animation:eq .9s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}@keyframes eq{to{height:14px}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0 40px}
@media(max-width:760px){body{padding:0 28px}.ai{margin:0 -28px;padding:48px 28px}.hero,.res{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{padding-top:36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function cards(list,box,n,t){

    const inner=(o.i?'<img src="'+o.i+'" alt="" loading="lazy" onerror="this.remove()">':"")+'<span class="ac"'+(o.a?"":' style="visibility:hidden"')+'>@'+(o.a||"-")+'</span><span class="pbtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="go">'+(o.u?t.open+ext:t.empty)+'</span>';

  }).join("");
}

(function(){
 const btn=$("#snd"),gate=$("#gate");let sc=0;
 function ui(){btn.classList.toggle("on",SND.isOn())}
 function enter(s){if(s)SND.start();ui();gate.classList.add("out");document.body.style.overflow="";setTimeout(function(){gate.remove()},900)}
